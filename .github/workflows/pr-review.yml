name: PR Review (AI)

# Thin shim -- delegates to the org-wide reusable workflow at
# Xylem-Group/.github/.github/workflows/pr-review.yml@trunk.
#
# That reusable workflow runs anthropics/claude-code-action (SHA-pinned,
# first-party, JavaScript Action) on GitHub-hosted runners and files the
# claude-review verdict as a native review + commit status. Centralizing
# in .github means action-version bumps happen once and propagate to every
# consumer repo. No explicit permissions block: the caller inherits the
# reusable workflow's declared job-level permissions, which avoids the
# under-declaration startup_failure trap of a hand-maintained caller block.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # `synchronize` is REQUIRED for the stall-breaker in the reusable
    # workflow's `review-gate` job. Without this event being delivered at
    # all, a PR that Claude marked CHANGES_REQUESTED and whose author then
    # pushes a fix gets no re-review, no `claude-review` status on the new
    # head SHA, and no re-trigger -- it stalls permanently. `review-gate`
    # re-reviews ONLY when the latest decisive verdict is CHANGES_REQUESTED,
    # so normal multi-commit PRs still get exactly one review and the
    # workflow's deliberate API-cost decision is preserved.
  issue_comment:

jobs:
  review:
    uses: Xylem-Group/.github/.github/workflows/pr-review.yml@trunk
    secrets: inherit
